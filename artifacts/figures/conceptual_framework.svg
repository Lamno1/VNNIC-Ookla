<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Conceptual framework and unresolved alternatives</title><desc id="desc">A theoretical pathway from connectivity to enterprise activity and four unresolved competing explanations.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17202a}.box{fill:#eef5ff;stroke:#35618d;stroke-width:2}.alt{fill:#fff4df;stroke:#9a6818;stroke-width:2}.arrow{stroke:#555;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect class="box" x="40" y="55" width="210" height="70" rx="10"/><text x="145" y="90" text-anchor="middle">Better connectivity</text>
<rect class="box" x="330" y="55" width="250" height="70" rx="10"/><text x="455" y="82" text-anchor="middle">Lower information, search,</text><text x="455" y="105" text-anchor="middle">communication costs</text>
<rect class="box" x="660" y="55" width="210" height="70" rx="10"/><text x="765" y="90" text-anchor="middle">Improved market access</text>
<rect class="box" x="950" y="55" width="210" height="70" rx="10"/><text x="1055" y="82" text-anchor="middle">Potential enterprise</text><text x="1055" y="105" text-anchor="middle">activity</text>
<line class="arrow" x1="250" y1="90" x2="325" y2="90"/><line class="arrow" x1="580" y1="90" x2="655" y2="90"/><line class="arrow" x1="870" y1="90" x2="945" y2="90"/>
<text x="600" y="165" text-anchor="middle" font-weight="bold">THEORETICAL — NOT CAUSALLY IDENTIFIED</text>
<rect class="alt" x="60" y="220" width="500" height="115" rx="10"/><text x="80" y="250" font-weight="bold">CH1 — Reverse causality/operator selection</text><text x="80" y="278">Stronger provinces may attract operator investment.</text><text x="80" y="306">Prediction: enterprise growth may precede connectivity.</text><text x="80" y="325">Status: UNRESOLVED</text>
<rect class="alt" x="640" y="220" width="500" height="115" rx="10"/><text x="660" y="250" font-weight="bold">CH2 — Common local development shocks</text><text x="660" y="278">Urbanization, roads, FDI or governance may shift both.</text><text x="660" y="306">Prediction: both track independently measured shocks.</text><text x="660" y="325">Status: UNRESOLVED</text>
<rect class="alt" x="60" y="385" width="500" height="115" rx="10"/><text x="80" y="415" font-weight="bold">CH3 — Speed-test composition</text><text x="80" y="443">Users, devices, providers or locations may change.</text><text x="80" y="471">Prediction: disagreement with Ookla or composition shifts.</text><text x="80" y="490">Status: UNRESOLVED</text>
<rect class="alt" x="640" y="385" width="500" height="115" rx="10"/><text x="660" y="415" font-weight="bold">CH4 — Formalization/reallocation</text><text x="660" y="443">Density may reflect registration or relocation.</text><text x="660" y="471">Prediction: no matching real-activity gains.</text><text x="660" y="490">Status: UNRESOLVED</text>
</svg>
